location = /nginx-health {
  default_type text/plain;
  access_log off;
  return 200 'ok';
}

location /.well-known/acme-challenge/ {
  root /var/www/certbot;
}

# Nest پیشوند /api دارد؛ مرورگر باید به sabad-yar.ir/api برود نه :3001
location /api/admin/backup/restore {
  client_max_body_size 512m;
  include /etc/nginx/snippets/proxy-headers.conf;
  set $sabadyar_api api:3001;
  proxy_pass http://$sabadyar_api;
}

# فایل دامپ بزرگ را در حافظهٔ nginx جمع نکن؛ وگرنه اتصال قطع می‌شود
location /api/admin/backup/download/ {
  include /etc/nginx/snippets/proxy-headers.conf;
  proxy_buffering off;
  proxy_request_buffering off;
  set $sabadyar_api api:3001;
  proxy_pass http://$sabadyar_api;
}

location /api {
  include /etc/nginx/snippets/proxy-headers.conf;
  set $sabadyar_api api:3001;
  proxy_pass http://$sabadyar_api;
}

location / {
  include /etc/nginx/snippets/proxy-headers.conf;
  set $sabadyar_web web:3000;
  proxy_pass http://$sabadyar_web;
}
