location = /nginx-health {
  default_type text/plain;
  access_log off;
  return 200 'ok';
}

location /.well-known/acme-challenge/ {
  root /var/www/certbot;
}

# Nest پیشوند /api دارد؛ مرورگر باید به sabad-yar.ir/api برود نه :3001
location /api {
  include /etc/nginx/snippets/proxy-headers.conf;
  set $sabadyar_api api:3001;
  proxy_pass http://$sabadyar_api;
}

location / {
  include /etc/nginx/snippets/proxy-headers.conf;
  set $sabadyar_web web:3000;
  proxy_pass http://$sabadyar_web;
}
