# گواهی باید هر سه دامنه را پوشش دهد: sabad-yar.ir و piiip.ir و piiip.ai

server {
  listen 80;
  listen [::]:80;
  server_name www.sabad-yar.ir;
  return 301 https://sabad-yar.ir$request_uri;
}

server {
  listen 80;
  listen [::]:80;
  server_name www.piiip.ir;
  return 301 https://piiip.ir$request_uri;
}

server {
  listen 80;
  listen [::]:80;
  server_name www.piiip.ai;
  return 301 https://piiip.ai$request_uri;
}

server {
  listen 80;
  listen [::]:80;
  server_name sabad-yar.ir piiip.ir piiip.ai;

  location = /nginx-health {
    default_type text/plain;
    access_log off;
    return 200 'ok';
  }

  location = /api/health {
    include /etc/nginx/snippets/proxy-headers.conf;
    set $sabadyar_api api:3001;
    proxy_pass http://$sabadyar_api;
  }

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 80 default_server;
  listen [::]:80 default_server;
  server_name _;

  location = /nginx-health {
    default_type text/plain;
    access_log off;
    return 200 'ok';
  }

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://sabad-yar.ir$request_uri;
  }
}

server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name www.sabad-yar.ir;

  ssl_certificate /etc/nginx/certs/fullchain.pem;
  ssl_certificate_key /etc/nginx/certs/privkey.pem;
  ssl_session_timeout 1d;
  ssl_session_cache shared:SSL:10m;
  ssl_protocols TLSv1.2 TLSv1.3;

  return 301 https://sabad-yar.ir$request_uri;
}

server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name www.piiip.ir;

  ssl_certificate /etc/nginx/certs/fullchain.pem;
  ssl_certificate_key /etc/nginx/certs/privkey.pem;
  ssl_session_timeout 1d;
  ssl_session_cache shared:SSL:10m;
  ssl_protocols TLSv1.2 TLSv1.3;

  return 301 https://piiip.ir$request_uri;
}

server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name www.piiip.ai;

  ssl_certificate /etc/nginx/certs/fullchain.pem;
  ssl_certificate_key /etc/nginx/certs/privkey.pem;
  ssl_session_timeout 1d;
  ssl_session_cache shared:SSL:10m;
  ssl_protocols TLSv1.2 TLSv1.3;

  return 301 https://piiip.ai$request_uri;
}

server {
  listen 443 ssl http2 default_server;
  listen [::]:443 ssl http2 default_server;
  server_name sabad-yar.ir piiip.ir piiip.ai _;

  ssl_certificate /etc/nginx/certs/fullchain.pem;
  ssl_certificate_key /etc/nginx/certs/privkey.pem;
  ssl_session_timeout 1d;
  ssl_session_cache shared:SSL:10m;
  ssl_protocols TLSv1.2 TLSv1.3;

  include /etc/nginx/snippets/app-proxy.conf;
}
