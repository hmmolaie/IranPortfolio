# سبدیار — استک کامل (nginx + web + api + postgres)
# از ریشهٔ مخزن:
#   cp docker/env.production.example .env
#   docker compose up -d --build
#
# عمومی فقط از nginx: https://sabad-yar.ir  و  https://sabad-yar.ir/api
# پورت‌های 3000 و 3001 روی اینترنت publish نمی‌شوند.

name: sabadyar

services:
  db:
    image: postgres:16-alpine
    container_name: sabadyar-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sabadyar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sabadyar}
      POSTGRES_DB: ${POSTGRES_DB:-sabadyar}
    volumes:
      - sabadyar_pg:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-sabadyar} -d ${POSTGRES_DB:-sabadyar}']
      interval: 5s
      timeout: 5s
      retries: 20
    expose:
      - '5432'
    networks:
      - sabadyar

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: sabadyar-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      API_PORT: 3001
      # فقط شبکهٔ داخلی داکر؛ روی کارت شبکهٔ هاست publish نمی‌شود
      API_LISTEN_HOST: 0.0.0.0
      DATABASE_URL: postgresql://${POSTGRES_USER:-sabadyar}:${POSTGRES_PASSWORD:-sabadyar}@db:5432/${POSTGRES_DB:-sabadyar}?schema=public
      JWT_SECRET: ${JWT_SECRET:-change-me-to-a-long-random-string}
      LLM_TOKEN_ENCRYPTION_KEY: ${LLM_TOKEN_ENCRYPTION_KEY:-0123456789abcdef0123456789abcdef}
      CORS_ORIGIN: ${CORS_ORIGIN:-https://sabad-yar.ir,http://sabad-yar.ir}
      PUBLIC_URL: ${PUBLIC_URL:-https://sabad-yar.ir}
      PLATFORM_LLM_BASE_URL: ${PLATFORM_LLM_BASE_URL:-https://api.openai.com/v1}
      PLATFORM_LLM_API_KEY: ${PLATFORM_LLM_API_KEY:-}
      PLATFORM_LLM_MODEL: ${PLATFORM_LLM_MODEL:-gpt-4o-mini}
      BRS_API_KEY: ${BRS_API_KEY:-}
      BRS_API_TYPES: ${BRS_API_TYPES:-1}
      LLM_MODEL_FALLBACKS: ${LLM_MODEL_FALLBACKS:-}
    volumes:
      - sabadyar_uploads:/app/apps/api/uploads
    expose:
      - '3001'
    healthcheck:
      test:
        [
          'CMD-SHELL',
          "node -e \"fetch('http://127.0.0.1:3001/api/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 90s
    networks:
      - sabadyar

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://sabad-yar.ir}
    container_name: sabadyar-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      # فقط شبکهٔ داخلی داکر برای رسیدن nginx
      HOSTNAME: 0.0.0.0
    expose:
      - '3000'
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3000']
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - sabadyar

  nginx:
    image: nginx:1.27-alpine
    container_name: sabadyar-nginx
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    ports:
      - '${NGINX_HTTP_PORT:-80}:80'
      - '${NGINX_HTTPS_PORT:-443}:443'
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/snippets:/etc/nginx/snippets:ro
      - ./docker/nginx/templates:/etc/nginx/templates:ro
      - ./docker/nginx/entrypoint.sh:/entrypoint.sh:ro
      - ./docker/nginx/certs:/etc/nginx/certs:ro
      - sabadyar_certbot:/var/www/certbot
    entrypoint: ['/bin/sh', '/entrypoint.sh']
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1/nginx-health']
      interval: 10s
      timeout: 3s
      retries: 8
      start_period: 10s
    networks:
      - sabadyar

volumes:
  sabadyar_pg:
  sabadyar_uploads:
  sabadyar_certbot:

networks:
  sabadyar:
    driver: bridge
